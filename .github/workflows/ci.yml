# wumonica.com — CI quality gate + Vercel deploy
#
# Runs on every push and pull request.
#   - build:  lint, typecheck, audit, static export + CSP, export hygiene checks.
#   - deploy: ONLY on push to main, ONLY if build passed. Deploys to Vercel with
#             the Vercel CLI (pull -> build -> deploy --prebuilt). PRs never deploy.
#   - Vercel's own Git auto-deploy stays OFF (no repo connected in Vercel
#     Settings > Git), so each merge deploys exactly once, from here.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   VERCEL_TOKEN       Vercel > Account Settings > Tokens
#   VERCEL_ORG_ID      "orgId" in .vercel/project.json (created by `vercel link`)
#   VERCEL_PROJECT_ID  "projectId" in .vercel/project.json
#
# The build runs on a clean Linux runner with `npm ci`, so the CSP hashes are no
# longer tied to any one laptop. The `Verify vercel.json` step fails if the
# committed CSP does not match what the build produced.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel stale PR runs, but never cancel a production deploy halfway through.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Lint · typecheck · audit · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install (clean, from lockfile, no lifecycle scripts)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Audit production dependencies
        run: npm run audit

      - name: Audit all dependencies (informational)
        run: npm run audit:all
        continue-on-error: true

      - name: Build static export + CSP
        run: npm run build

      - name: Verify vercel.json CSP is committed and current
        run: |
          if ! git diff --quiet -- vercel.json; then
            echo "::error file=vercel.json::vercel.json is out of date. Commit the Linux hashes printed by scripts/csp-hashes.mjs. Do not refresh them with a Windows build."
            git --no-pager diff -- vercel.json
            exit 1
          fi

      - name: Verify export hygiene
        run: |
          set -e
          test -f out/index.html
          test -f out/404.html
          test -f out/.htaccess
          grep -q 'Content-Security-Policy "default-src' out/.htaccess
          # Nothing that should never be public
          if find out -type f \( -name '*.map' -o -name '*.md' -o -name '.env*' -o -name '*.lock' -o -name '*.log' \) | grep -q .; then
            echo "::error::Unexpected sensitive file(s) in out/"; find out -type f \( -name '*.map' -o -name '*.md' -o -name '.env*' -o -name '*.lock' -o -name '*.log' \); exit 1
          fi
          # No inline event handlers / javascript: URLs / style attributes in rendered HTML
          ! grep -rEl '\son[a-z]+=|href=["'\'']javascript:|\sstyle=' out --include='*.html'

      - name: Upload static site (backup copy of the exact build)
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: out
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy to Vercel
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://wumonica.com
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install (clean, from lockfile)
        run: npm ci

      - name: Pull Vercel project settings (production)
        run: npx --yes vercel@65 pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build on this Linux runner
        run: npx --yes vercel@65 build --prod --token="$VERCEL_TOKEN"

      - name: Deploy the prebuilt output to production
        run: npx --yes vercel@65 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
