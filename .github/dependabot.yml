# Dependabot — weekly dependency and security updates.
# Security advisories open PRs immediately regardless of schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    groups:
      # One PR for all routine minor/patch bumps; majors stay separate for review.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Keep @types/node on the same major as the Node version CI runs (22).
      # Bump this by hand when CI moves to a newer Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (native compiler) waits until Next.js and ESLint support it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: deps
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    commit-message:
      prefix: ci
    labels: [dependencies, ci]
