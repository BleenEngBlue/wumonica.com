# Dependabot — weekly dependency and security updates.
# Security advisories open PRs immediately regardless of schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    groups:
      # One PR for all routine minor/patch bumps; majors stay separate for review.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # (Updated 2026-11-09)
      # Keep @types/node on the same major as the Node version CI runs (22).
      # Bump it by hand when ci.yml moves to Node 24 or 26 (both LTS).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7.0 has no compiler API, so typescript-eslint (used by
      # eslint-config-next) rejects it: peer range is typescript <6.1.0.
      # Remove this entry once typescript-eslint supports TS 7 (expected after
      # TS 7.1, targeted for 2026-11-24). Next.js 16.4 already supports TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: deps
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    commit-message:
      prefix: ci
    labels: [dependencies, ci]
